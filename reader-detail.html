<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Okuyucu Detayı & Rozetler</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 p-6">

  <div class="max-w-5xl mx-auto space-y-6">
    <div class="flex justify-between items-center bg-white p-6 rounded-2xl shadow-sm">
      <div>
        <h1 id="readerTitle" class="text-2xl font-black text-slate-800">Okuyucu Profili</h1>
        <p class="text-xs text-slate-500">Kazanılan rozetler ve okuma geçmişi</p>
      </div>
      <a href="dashboard.html" class="bg-indigo-50 text-indigo-600 px-4 py-2 rounded-lg font-bold text-sm">
        <i class="fa-solid fa-arrow-left"></i> Panele Dön
      </a>
    </div>

    <!-- Rozetler Alanı -->
    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
      <h2 class="text-lg font-bold mb-4 text-slate-800 flex items-center gap-2">
        <i class="fa-solid fa-award text-amber-500 text-xl"></i> Kazanılan Rozetler (Oyunlaştırma)
      </h2>
      <div id="badgesContainer" class="grid grid-cols-2 md:grid-cols-4 gap-4">
        <!-- Rozetler Dinamik Yüklenecek -->
      </div>
    </div>

    <!-- Kişisel Okuma Geçmişi -->
    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
      <h2 class="text-lg font-bold mb-4 text-slate-800">Okunan Kitaplar</h2>
      <div id="personalBooksList" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <!-- Kitaplar Dinamik Yüklenecek -->
      </div>
    </div>
  </div>

  <script type="module">
    import { auth, db } from './firebase-config.js';
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const urlParams = new URLSearchParams(window.location.search);
    const readerName = urlParams.get('reader') || 'Oğlum';

    document.getElementById('readerTitle').innerText = `${readerName} - Okuma Karnesi`;

    onAuthStateChanged(auth, async user => {
      if (!user) window.location.href = 'index.html';
      else loadReaderProfile();
    });

    async function loadReaderProfile() {
      const q = query(collection(db, "reading_logs"), where("readerName", "==", readerName));
      const querySnapshot = await getDocs(q);

      let bookCount = 0;
      let pageTotal = 0;
      const categories = new Set();
      let fiveStarCount = 0;
      let noteCount = 0;
      const completedDates = new Set();
      const monthlyCounts = new Map();
      const authors = new Set();

      const booksList = document.getElementById('personalBooksList');
      booksList.innerHTML = '';

      querySnapshot.forEach(doc => {
        const data = doc.data();
        bookCount++;
        pageTotal += Number(data.pageCount || 0);
        if (data.category) categories.add(data.category);
        if (Number(data.rating) === 5) fiveStarCount++;
        if (data.shortNote && data.shortNote.trim()) noteCount++;
        if (data.author && data.author.trim()) authors.add(data.author.trim());
        if (data.dateFinished) completedDates.add(data.dateFinished);
        if (data.dateFinished && data.dateFinished.length >= 7) {
          const month = data.dateFinished.slice(0, 7);
          monthlyCounts.set(month, (monthlyCounts.get(month) || 0) + 1);
        }

        booksList.innerHTML += `
          <div class="flex gap-4 p-4 border border-slate-100 rounded-xl bg-slate-50">
            <img src="${data.coverUrl}" class="w-16 h-24 object-cover rounded shadow-sm">
            <div class="space-y-1">
              <h3 class="font-bold text-slate-800">${data.bookTitle}</h3>
              <p class="text-xs text-slate-500">${data.author} | <span class="font-semibold text-indigo-600">${data.pageCount} Sayfa</span></p>
              <p class="text-xs text-slate-600 italic mt-1">"${data.shortNote || 'Not eklenmedi.'}"</p>
            </div>
          </div>
        `;
      });

      const maxMonthlyCount = Math.max(0, ...monthlyCounts.values());
      renderBadges(bookCount, pageTotal, categories.size, fiveStarCount, noteCount, completedDates.size, maxMonthlyCount, authors.size);
    }

    function renderBadges(books, pages, categoryCount, fiveStarCount, noteCount, dateCount, monthlyCount, authorCount) {
      const badges = [
        { name: "İlk Adım", desc: "1 Kitap Okundu", active: books >= 1, icon: "fa-star", color: "text-amber-500" },
        { name: "Kitap Kurdu", desc: "5+ Kitap Okundu", active: books >= 5, icon: "fa-book-bookmark", color: "text-indigo-500" },
        { name: "Kütüphane Dostu", desc: "10+ Kitap Okundu", active: books >= 10, icon: "fa-book-open-reader", color: "text-sky-500" },
        { name: "Efsane Okur", desc: "25+ Kitap Okundu", active: books >= 25, icon: "fa-crown", color: "text-amber-600" },
        { name: "Kitap Koleksiyoncusu", desc: "50+ Kitap Okundu", active: books >= 50, icon: "fa-layer-group", color: "text-indigo-700" },
        { name: "Kütüphane Efsanesi", desc: "100+ Kitap Okundu", active: books >= 100, icon: "fa-landmark", color: "text-slate-800" },
        { name: "Sayfa Canavarı", desc: "500+ Sayfa Okundu", active: pages >= 500, icon: "fa-fire", color: "text-red-500" },
        { name: "Bin Sayfalık Macera", desc: "1000+ Sayfa Okundu", active: pages >= 1000, icon: "fa-mountain", color: "text-emerald-600" },
        { name: "Büyük Kitaplık", desc: "5000+ Sayfa Okundu", active: pages >= 5000, icon: "fa-building-columns", color: "text-slate-700" },
        { name: "On Bin Sayfalık Yol", desc: "10.000+ Sayfa Okundu", active: pages >= 10000, icon: "fa-road", color: "text-amber-700" },
        { name: "Kitap İmparatorluğu", desc: "20.000+ Sayfa Okundu", active: pages >= 20000, icon: "fa-chess-king", color: "text-purple-800" },
        { name: "Tür Gezgini", desc: "3 Farklı Tür Okundu", active: categoryCount >= 3, icon: "fa-compass", color: "text-teal-500" },
        { name: "Edebiyat Kaşifi", desc: "5 Farklı Tür Okundu", active: categoryCount >= 5, icon: "fa-earth-europe", color: "text-cyan-600" },
        { name: "Çok Yönlü Okur", desc: "8 Farklı Tür Okundu", active: categoryCount >= 8, icon: "fa-dna", color: "text-fuchsia-600" },
        { name: "Kategori Ustası", desc: "10 Farklı Tür Okundu", active: categoryCount >= 10, icon: "fa-ranking-star", color: "text-rose-700" },
        { name: "Beş Yıldızlı", desc: "İlk 5 Puanlı Kitap", active: fiveStarCount >= 1, icon: "fa-star", color: "text-yellow-500" },
        { name: "Beş Yıldız Koleksiyoncusu", desc: "10 Kitap 5 Puan Aldı", active: fiveStarCount >= 10, icon: "fa-gem", color: "text-yellow-600" },
        { name: "Mükemmellik Avcısı", desc: "25 Kitap 5 Puan Aldı", active: fiveStarCount >= 25, icon: "fa-trophy", color: "text-amber-700" },
        { name: "Eleştirmen", desc: "5 Kitap İçin Not Yazıldı", active: noteCount >= 5, icon: "fa-pen-nib", color: "text-violet-500" },
        { name: "Kitap Günlüğü", desc: "10 Kitap İçin Not Yazıldı", active: noteCount >= 10, icon: "fa-book-open", color: "text-pink-500" },
        { name: "Eleştiri Uzmanı", desc: "25 Kitap İçin Not Yazıldı", active: noteCount >= 25, icon: "fa-feather-pointed", color: "text-violet-700" },
        { name: "Farklı Günler", desc: "Farklı 7 Gün Kitap Bitirildi", active: dateCount >= 7, icon: "fa-calendar-check", color: "text-blue-500" },
        { name: "Okuma Maratonu", desc: "Farklı 30 Gün Kitap Bitirildi", active: dateCount >= 30, icon: "fa-person-running", color: "text-red-600" },
        { name: "Ayın Okuru", desc: "Bir Ayda 10 Kitap Bitirildi", active: monthlyCount >= 10, icon: "fa-calendar-days", color: "text-orange-500" },
        { name: "Aylık Hız Patronu", desc: "Bir Ayda 25 Kitap Bitirildi", active: monthlyCount >= 25, icon: "fa-bolt-lightning", color: "text-orange-700" },
        { name: "Yazar Kaşifi", desc: "10 Farklı Yazarın Kitabını Okudu", active: authorCount >= 10, icon: "fa-signature", color: "text-cyan-700" },
        { name: "Edebiyat Sömürgesi", desc: "25 Farklı Yazarın Kitabını Okudu", active: authorCount >= 25, icon: "fa-atlas", color: "text-emerald-700" },
        { name: "Düzenli Okur", desc: "En Az 10 Kayıt Tamamlandı", active: books >= 10, icon: "fa-seedling", color: "text-green-600" }
      ];

      const container = document.getElementById('badgesContainer');
      container.innerHTML = badges.map(b => `
        <div class="p-4 rounded-xl border text-center ${b.active ? 'bg-amber-50 border-amber-200' : 'bg-slate-50 border-slate-200 opacity-40'}">
          <i class="fa-solid ${b.icon} text-3xl mb-2 ${b.active ? b.color : 'text-slate-400'}"></i>
          <h4 class="font-bold text-sm text-slate-800">${b.name}</h4>
          <p class="text-xs text-slate-500">${b.desc}</p>
          <span class="inline-block mt-2 text-[10px] font-bold uppercase px-2 py-0.5 rounded ${b.active ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-200 text-slate-600'}">
            ${b.active ? 'Kazanıldı' : 'Kilitli'}
          </span>
        </div>
      `).join('');
    }
  </script>
</body>
</html>
