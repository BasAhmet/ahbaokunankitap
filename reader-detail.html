<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Okuyucu Detayı & Rozetler</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 p-6">

  <div class="max-w-5xl mx-auto space-y-6">
    <div class="flex justify-between items-center bg-white p-6 rounded-2xl shadow-sm">
      <div>
        <h1 id="readerTitle" class="text-2xl font-black text-slate-800">Okuyucu Profili</h1>
        <p class="text-xs text-slate-500">Kazanılan rozetler ve okuma geçmişi</p>
      </div>
      <a href="dashboard.html" class="bg-indigo-50 text-indigo-600 px-4 py-2 rounded-lg font-bold text-sm">
        <i class="fa-solid fa-arrow-left"></i> Panele Dön
      </a>
    </div>

    <!-- Rozetler Alanı -->
    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
      <h2 class="text-lg font-bold mb-4 text-slate-800 flex items-center gap-2">
        <i class="fa-solid fa-award text-amber-500 text-xl"></i> Kazanılan Rozetler (Oyunlaştırma)
      </h2>
      <div id="badgesContainer" class="grid grid-cols-2 md:grid-cols-4 gap-4">
        <!-- Rozetler Dinamik Yüklenecek -->
      </div>
    </div>

    <!-- Kişisel Okuma Geçmişi -->
    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
      <h2 class="text-lg font-bold mb-4 text-slate-800">Okunan Kitaplar</h2>
      <div id="personalBooksList" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <!-- Kitaplar Dinamik Yüklenecek -->
      </div>
    </div>
  </div>

  <script type="module">
    import { auth, db } from './firebase-config.js';
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const urlParams = new URLSearchParams(window.location.search);
    const readerName = urlParams.get('reader') || 'Oğlum';

    document.getElementById('readerTitle').innerText = `${readerName} - Okuma Karnesi`;

    onAuthStateChanged(auth, async user => {
      if (!user) window.location.href = 'index.html';
      else loadReaderProfile();
    });

    async function loadReaderProfile() {
      const q = query(collection(db, "reading_logs"), where("readerName", "==", readerName));
      const querySnapshot = await getDocs(q);

      let bookCount = 0;
      let pageTotal = 0;
      let maxSpeed = 0;
      let highComprehensionCount = 0;

      const booksList = document.getElementById('personalBooksList');
      booksList.innerHTML = '';

      querySnapshot.forEach(doc => {
        const data = doc.data();
        bookCount++;
        pageTotal += Number(data.pageCount || 0);
        if (data.readingSpeed > maxSpeed) maxSpeed = data.readingSpeed;
        if (data.comprehensionScore >= 85) highComprehensionCount++;

        booksList.innerHTML += `
          <div class="flex gap-4 p-4 border border-slate-100 rounded-xl bg-slate-50">
            <img src="${data.coverUrl}" class="w-16 h-24 object-cover rounded shadow-sm">
            <div class="space-y-1">
              <h3 class="font-bold text-slate-800">${data.bookTitle}</h3>
              <p class="text-xs text-slate-500">${data.author} | <span class="font-semibold text-indigo-600">${data.pageCount} Sayfa</span></p>
              <div class="text-xs font-semibold text-amber-500">Hız: ${data.readingSpeed} K/Dk | Anlama: %${data.comprehensionScore}</div>
              <p class="text-xs text-slate-600 italic mt-1">"${data.shortNote || 'Not eklenmedi.'}"</p>
            </div>
          </div>
        `;
      });

      renderBadges(bookCount, pageTotal, maxSpeed, highComprehensionCount);
    }

    function renderBadges(books, pages, maxSpeed, highComp) {
      const badges = [
        { name: "İlk Adım", desc: "1 Kitap Okundu", active: books >= 1, icon: "fa-star", color: "text-amber-500" },
        { name: "Kitap Kurdu", desc: "5+ Kitap Okundu", active: books >= 5, icon: "fa-book-bookmark", color: "text-indigo-500" },
        { name: "Sayfa Canavarı", desc: "500+ Sayfa Okundu", active: pages >= 500, icon: "fa-fire", color: "text-red-500" },
        { name: "Şimşek Okuyucu", desc: "100+ Kelime/Dk Hız", active: maxSpeed >= 100, icon: "fa-bolt", color: "text-yellow-500" },
        { name: "Süper Zeka", desc: "High Anlama Oranı (%85+)", active: highComp >= 1, icon: "fa-brain", color: "text-purple-500" }
      ];

      const container = document.getElementById('badgesContainer');
      container.innerHTML = badges.map(b => `
        <div class="p-4 rounded-xl border text-center ${b.active ? 'bg-amber-50 border-amber-200' : 'bg-slate-50 border-slate-200 opacity-40'}">
          <i class="fa-solid ${b.icon} text-3xl mb-2 ${b.active ? b.color : 'text-slate-400'}"></i>
          <h4 class="font-bold text-sm text-slate-800">${b.name}</h4>
          <p class="text-xs text-slate-500">${b.desc}</p>
          <span class="inline-block mt-2 text-[10px] font-bold uppercase px-2 py-0.5 rounded ${b.active ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-200 text-slate-600'}">
            ${b.active ? 'Kazanıldı' : 'Kilitli'}
          </span>
        </div>
      `).join('');
    }
  </script>
</body>
</html>
