<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Okuma Takip Sistemi - Giriş</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">

</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen">

  <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md">
    <div class="text-center mb-6">
      <div class="bg-indigo-100 text-indigo-600 w-16 h-16 rounded-full flex items-center justify-center mx-auto text-2xl mb-2">
        <i class="fa-solid fa-book-open"></i>
      </div>
      <h1 class="text-2xl font-bold text-slate-800">Okuma Takip Portalı</h1>
      <p class="text-slate-500 text-sm">Giriş yapın veya yeni okuyucu hesabı açın</p>
    </div>

    <form id="authForm" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">E-Posta</label>
        <input type="email" id="email" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">Şifre</label>
        <input type="password" id="password" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
      </div>
      <p id="errorMsg" class="text-red-500 text-xs hidden text-center"></p>

      <button type="submit" id="loginBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 rounded-lg transition">Giriş Yap</button>
      <button type="button" id="registerBtn" class="w-full border border-indigo-600 text-indigo-600 hover:bg-indigo-50 font-medium py-2 rounded-lg transition">Kayıt Ol</button>
    </form>
  </div>

  <script type="module">
    import { auth } from './firebase-config.js';
    import { signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const errorMsg = document.getElementById('errorMsg');

    document.getElementById('authForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        await signInWithEmailAndPassword(auth, emailInput.value, passwordInput.value);
        window.location.href = 'dashboard.html';
      } catch (err) {
        errorMsg.innerText = "Giriş başarısız: " + err.message;
        errorMsg.classList.remove('hidden');
      }
    });

    document.getElementById('registerBtn').addEventListener('click', async () => {
      try {
        await createUserWithEmailAndPassword(auth, emailInput.value, passwordInput.value);
        alert('Kayıt başarılı! Giriş yapılıyor...');
        window.location.href = 'dashboard.html';
      } catch (err) {
        errorMsg.innerText = "Kayıt hatası: " + err.message;
        errorMsg.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
